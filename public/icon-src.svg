<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background so maskable crops never expose transparency -->
  <rect x="0" y="0" width="512" height="512" fill="#0b0b0d"/>
  <!-- inner framed card (kept inside the maskable safe zone ~80%) -->
  <rect x="80" y="80" width="352" height="352" rx="64" fill="#0b0b0d" stroke="url(#g)" stroke-width="10"/>
  <!-- prompt chevron -->
  <path d="M168 196 L248 276 L168 356" fill="none" stroke="url(#g)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor underscore -->
  <rect x="268" y="328" width="120" height="28" rx="10" fill="#00ff9c"/>
</svg>
